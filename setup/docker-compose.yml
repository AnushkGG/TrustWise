services:
  backend:
    build:
      context: ..
      dockerfile: setup/Dockerfile
    image: trustwise:latest
    container_name: trustwise-backend
    command: ["python", "legacy/app.py"]
    ports:
      - "5000:5000"
    env_file:
      - ../.env
    environment:
      # Inside Docker, "localhost" points to the container, not your host.
      # Default Ollama to the host bridge so planning works out-of-the-box.
      OLLAMA_BASE_URL: ${OLLAMA_BASE_URL:-http://host.docker.internal:11434}
      FREELLMAPI_BASE_URL: ${FREELLMAPI_BASE_URL:-http://host.docker.internal:3001/v1}
      HOST: ${HOST:-0.0.0.0}
      PYTHONPATH: /app
    volumes:
      - ../agents:/app/agents
      - ../orchestrator:/app/orchestrator
      - ../insights:/app/insights
      - ../trust:/app/trust
      - ../utils:/app/utils
      - ../legacy:/app/legacy
      - ../static:/app/static
      - ../frontend/public:/app/frontend/public
      - ../api_bridge.py:/app/api_bridge.py
      - ../data:/app/data
      - ../logs:/app/logs
    init: true
    stop_grace_period: 30s
    restart: unless-stopped
    healthcheck:
      test: [ "CMD", "curl", "-fsS", "http://127.0.0.1:5000/api/status" ]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 40s
    extra_hosts:
      - "host.docker.internal:host-gateway"

  frontend:
    image: trustwise:latest
    container_name: trustwise-frontend
    ports:
      - "5001:5001"
    env_file:
      - ../.env
    volumes:
      - ../frontend/public:/app/frontend/public
    init: true
    stop_grace_period: 30s
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy

